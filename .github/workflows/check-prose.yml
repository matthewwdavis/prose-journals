# The checks of a pull request that need prose (README: "Checks"): its LaTeX compiles, its Word
# layout is what its LaTeX prints, and a preview (prose's sample as PDF, Word and pictures). Then one
# comment on the pull request with every job's result, and the result "journal-check" on its commit
# (the one main's rules require).
#
# Why a second workflow: prose's repository is private, so these jobs read it with the secret
# PROSE_READ_TOKEN, and GitHub never gives a secret to a pull request from someone's own copy of the
# library (a fork, which is how the apps' Share… sends a journal). So check.yml runs on the pull
# request with no secrets, and when it finishes this workflow runs here, in the library itself, with
# the secret. It never runs the pull request's code: the tools, the workflows and the rules all come
# from the library's main branch, and only the pull request's journals/ folder is taken, as data,
# after checking it holds only plain files. Its LaTeX (latex.wrapper_text) is checked first
# (validate refuses LaTeX that reads or writes other files or runs programs) and the prose jobs
# run only once validate passes; a publisher's package is downloaded only from an address the
# library's journals already use; caches are only read here, never written; the token is used by
# the checkout of prose alone and never kept in it. A first-time contributor's pull request waits for
# a maintainer to approve its checks (Settings ▸ Actions ▸ General ▸ approval for outside
# collaborators), so look at its journal file before approving.
#
# Run by hand (Actions ▸ Check a journal with prose ▸ Run workflow) with a pull request's number, or
# a journal file on main (journals/<id>.json). Switched off until the library is published: it runs
# after check.yml only when the repository variable LIBRARY_CI is "on".
name: Check a journal with prose

on:
  # zizmor: ignore[dangerous-triggers] (the point of this workflow: it runs with the secret for pull requests
  # from forks, and it never runs their code; see above)
  workflow_run:
    workflows: ["Check a journal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "A pull request's number, or a journal file on main (journals/<id>.json)"
        required: true

permissions: {}

concurrency:
  group: check-prose-${{ github.event.workflow_run.head_sha || inputs.target }}
  cancel-in-progress: true

env:
  CONTEXT: journal-check   # (the result's name on the pull request's commit)

jobs:
  request:
    name: What to check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.LIBRARY_CI == 'on' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      go: ${{ steps.find.outputs.go }}
      pr: ${{ steps.find.outputs.pr }}
      head_sha: ${{ steps.find.outputs.head_sha }}
      base_ref: ${{ steps.find.outputs.base_ref }}
      author: ${{ steps.find.outputs.author }}
      file: ${{ steps.find.outputs.file }}
      changed: ${{ steps.find.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Find the pull request (or what was given by hand)
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/find_request.sh
      - name: Mark the pull request's check as running
        if: steps.find.outputs.go == 'true' && steps.find.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.find.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f description="Checking the journal (LaTeX, Word layout, preview)" -f target_url="$RUN_URL" > /dev/null

  validate:
    name: validate
    needs: request
    if: needs.request.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Take the pull request's journal files (as data)
        env:
          PR: ${{ needs.request.outputs.pr }}
          HEAD_SHA: ${{ needs.request.outputs.head_sha }}
          BASE_REF: ${{ needs.request.outputs.base_ref }}
          FILE: ${{ needs.request.outputs.file }}
        run: |
          if [ -n "$PR" ]; then .github/scripts/take_journals.sh "$PR" "$HEAD_SHA" "$BASE_REF"
          else printf '%s\n' "$FILE" > changed.txt; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the file (format, the library's rules, its version, its badge)
        env:
          BASE_REF: ${{ needs.request.outputs.base_ref }}
          AUTHOR: ${{ needs.request.outputs.author }}
        run: |
          python tools/check_journal.py --strict --base "origin/$BASE_REF" --author "$AUTHOR" \
            --changed-files changed.txt --report reports/validate.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: report-validate
          path: reports/
          if-no-files-found: ignore

  index:
    name: index
    needs: request
    if: needs.request.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Take the pull request's journal files (as data)
        if: needs.request.outputs.pr != ''
        env:
          PR: ${{ needs.request.outputs.pr }}
          HEAD_SHA: ${{ needs.request.outputs.head_sha }}
          BASE_REF: ${{ needs.request.outputs.base_ref }}
        run: .github/scripts/take_journals.sh "$PR" "$HEAD_SHA" "$BASE_REF"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the index; fail on two journals with the same id, name or ISSN
        run: python tools/build_index.py --check --ignore-index --report reports/index.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: report-index
          path: reports/
          if-no-files-found: ignore

  prose:
    # latex (Linux), word-layout (a Mac, as the layouts were measured) and preview (Linux)
    name: ${{ matrix.job }}
    needs: [request, validate]
    if: needs.request.outputs.go == 'true' && needs.validate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: latex
            os: ubuntu-latest
          - job: word-layout
            os: macos-latest
          - job: preview
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the publishers' download addresses the library already uses (before taking the pull request's files)
        run: python3 tools/publisher.py --known-urls journals > "$RUNNER_TEMP/known-urls.txt"
      - name: Take the pull request's journal files (as data)
        if: needs.request.outputs.pr != ''
        env:
          PR: ${{ needs.request.outputs.pr }}
          HEAD_SHA: ${{ needs.request.outputs.head_sha }}
          BASE_REF: ${{ needs.request.outputs.base_ref }}
        run: .github/scripts/take_journals.sh "$PR" "$HEAD_SHA" "$BASE_REF"
      - name: Get prose and its environment
        id: prose
        if: needs.request.outputs.file != ''
        uses: ./.github/actions/prose
        with:
          token: ${{ secrets.PROSE_READ_TOKEN }}
          repository: ${{ vars.PROSE_REPO || 'matthewwdavis/prose' }}
          ref: ${{ vars.PROSE_REF || 'main' }}
          cache: restore
      - name: Run the ${{ matrix.job }} check
        env:
          JOB: ${{ matrix.job }}
          FILE: ${{ needs.request.outputs.file }}
          PROSE_SRC: ${{ steps.prose.outputs.prose-src }}
          PROBLEM: ${{ steps.prose.outputs.problem }}
          LIBRARY_DOWNLOAD_ALLOWED: ${{ runner.temp }}/known-urls.txt
          LIBRARY_CACHE: ${{ steps.prose.outputs.cache-dir }}
        run: |
          mkdir -p reports
          if [ -z "$FILE" ]; then
            printf '<!-- job: %s; result: skipped -->\nChecked: %s skipped (no journal file changed)\n' "$JOB" "$JOB" > "reports/$JOB.md"
            exit 0
          fi
          if [ "$PROSE_SRC" = "none" ]; then
            printf '<!-- job: %s; result: failed -->\n- %s: error: %s\nChecked: %s not run\n' "$JOB" "$FILE" "$PROBLEM" "$JOB" > "reports/$JOB.md"
            exit 1
          fi
          case "$JOB" in
            latex) python tools/compile_latex.py "$FILE" --download --report reports/latex.md ;;
            word-layout) python tools/measure_layout.py "$FILE" --download --report reports/word-layout.md ;;
            preview) python tools/render_preview.py "$FILE" --out preview-out --report reports/preview.md ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: report-${{ matrix.job }}
          path: reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always() && matrix.job == 'preview'
        with:
          name: preview
          path: preview-out/
          if-no-files-found: ignore

  summary:
    name: summary
    needs: [request, validate, index, prose]
    if: always() && needs.request.result == 'success' && needs.request.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: report-*
          path: reports
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Write the comment
        env:
          FILE: ${{ needs.request.outputs.file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p reports
          python tools/summarize.py --dir reports --title "${FILE:-no journal file}" --preview-url "$RUN_URL#artifacts" \
            --expect validate,index,latex,word-layout,preview --state-out state.txt --out comment.md > /dev/null
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post it on the pull request (or update the one posted before)
        if: needs.request.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.request.outputs.pr }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: Give the pull request's commit the result
        if: always() && needs.request.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.request.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=$(cat state.txt 2>/dev/null || echo error)
          case "$state" in
            success) words="The journal passed the library's checks" ;;
            failure) words="The journal needs changes: see the comment" ;;
            *) state=error; words="The check couldn't finish: see the run" ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f description="$words" -f target_url="$RUN_URL" > /dev/null
          [ "$state" = "success" ]
